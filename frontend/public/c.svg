<svg xmlns="http://www.w3.org/2000/svg" width="420" height="120" viewBox="0 0 420 120">
  <defs>
    <linearGradient id="chatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Centered group -->
  <g transform="translate(105, 60)">

    <!-- Chat bubble circle outline -->
    <circle cx="0" cy="-5" r="28" fill="none" stroke="url(#chatGrad)" stroke-width="4"/>

    <!-- Chat bubble tail -->
    <path
      d="M-10 20 Q-18 28 -8 32 Q2 28 8 22"
      fill="none"
      stroke="url(#chatGrad)"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Trend line / chart line inside circle -->
    <polyline
      points="-18,-5 -8,5 4,-8 18,2"
      fill="none"
      stroke="url(#chatGrad)"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Chatlytics text -->
    <text
      x="45"
      y="0"
      dominant-baseline="middle"
      font-size="36"
      font-weight="700"
      fill="#1a1a2e"
      font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    >
      Chatlytics
    </text>

  </g>
</svg>
